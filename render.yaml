services:
  - type: web
    name: inventario-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Se piden en el dashboard de Render al crear el servicio (no van en el repo)
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
